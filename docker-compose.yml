# Single-host deployment: recorder + Postgres + Data API.
#
# Sized for the smallest useful VPS (2 vCPU / 4 GB). The recorder is I/O bound,
# not CPU bound. A managed database is not needed at this stage and would cost
# several times the server.
#
# NOTE: when live execution is added later it does NOT belong in this file.
# The host holding trading keys must not be the host serving a public
# dashboard — that is a security boundary, not an optimisation.

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: atlas
      POSTGRES_PASSWORD: ${FA_PG_PASSWORD:-atlas}
      POSTGRES_DB: atlas
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U atlas"]
      interval: 10s
      timeout: 5s
      retries: 5
    # Not published: only reachable inside the compose network.

  recorder:
    build: .
    restart: unless-stopped
    command: ["fa-record", "--config", "/app/config/recorder.yaml"]
    env_file: .env
    environment:
      FA_PG_DSN: postgresql://atlas:${FA_PG_PASSWORD:-atlas}@postgres:5432/atlas
      FA_DATA_DIR: /data
    volumes:
      - ./config:/app/config:ro
      - atlasdata:/data
    depends_on:
      postgres:
        condition: service_healthy
    # The recorder must survive reboots untouched: a gap is permanent.
    stop_grace_period: 30s

  api:
    build: .
    restart: unless-stopped
    command: ["fa-api", "--host", "0.0.0.0", "--port", "8000"]
    env_file: .env
    environment:
      FA_PG_DSN: postgresql://atlas:${FA_PG_PASSWORD:-atlas}@postgres:5432/atlas
      FA_DATA_DIR: /data
    volumes:
      - atlasdata:/data:ro
    expose:
      - "8000"   # compose network only; Caddy is the only way in
    depends_on:
      postgres:
        condition: service_healthy

  # Edge: TLS, the static dashboard, and the API proxy. Behind a profile so a
  # development host can run the recorder without claiming ports 80 and 443.
  caddy:
    image: caddy:2-alpine
    profiles: ["edge"]
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      FA_DOMAIN: ${FA_DOMAIN:?set FA_DOMAIN in .env}
      FA_API_DOMAIN: ${FA_API_DOMAIN:?set FA_API_DOMAIN in .env}
      FA_ACME_EMAIL: ${FA_ACME_EMAIL:-}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - ./web/out:/srv/web:ro
      - caddydata:/data      # certificates: losing this means re-issuing them
      - caddyconfig:/config
    depends_on:
      - api


volumes:
  pgdata:
  atlasdata:
  caddydata:
  caddyconfig:
