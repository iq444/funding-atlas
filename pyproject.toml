[project]
name = "funding-atlas"
version = "0.0.1"
description = "Open market-data recorder, event log and research toolkit for perpetual-futures funding"
requires-python = ">=3.12"
license = { text = "Apache-2.0" }
dependencies = [
    "websockets>=13.0",
    "httpx>=0.27",
    "pyarrow>=17.0",
    "duckdb>=1.1",
    "pydantic>=2.9",
    "pyyaml>=6.0",
    "structlog>=24.4",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
]

[project.optional-dependencies]
dev = ["pytest>=8.3", "pytest-asyncio>=0.24", "ruff>=0.7", "mypy>=1.13"]

[project.scripts]
fa-record = "funding_atlas.recorder.main:cli"
fa-api = "funding_atlas.api.main:cli"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/funding_atlas"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
